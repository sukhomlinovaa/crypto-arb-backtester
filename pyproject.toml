[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hft-crypto-arb"
version = "0.1.0"
description = "Event-driven cross-venue crypto arbitrage simulator with L2 depth, latency-aware execution, venue inventory accounting, and deterministic replay."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alex S." }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4"
]

[project.scripts]
hft-crypto-arb = "hft_crypto_arb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
